<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Statements</h2>
        <p>A <b> JavaScript Program</b> is a list of statements<b>to be executed</b> by the computer.</p>

        <script>
            var x,y,z; //statement1:
            x=5; //statement2:

        </script>
    </body>
</html>
